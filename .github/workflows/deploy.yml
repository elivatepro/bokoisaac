name: Deploy

on:
  push:
    branches: [main]
  # Hourly: rebuild only if something changed in Notion. The 03:07 UTC run rebuilds regardless.
  schedule:
    - cron: '7 * * * *'
  # "Run workflow" button in GitHub (works from the mobile app too) to publish right away.
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check Notion for changes
        id: notion
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%H)" = "03" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; echo "Daily full rebuild"; exit 0; fi
          node scripts/notion-changed.mjs

      - name: Build
        if: steps.notion.outcome == 'skipped' || steps.notion.outputs.changed == 'true'
        run: npm run build

      - name: Deploy to Cloudflare
        if: steps.notion.outcome == 'skipped' || steps.notion.outputs.changed == 'true'
        run: npx wrangler deploy

      # /api/subscribe, /api/comments and /api/contact read these at runtime (TURNSTILE_SECRET_KEY is skipped while unset), so the Worker gets them as encrypted secrets.
      # Piped as JSON on stdin: the values never touch a file or the log.
      - name: Sync Worker secrets
        if: steps.notion.outcome == 'skipped' || steps.notion.outputs.changed == 'true'
        run: |
          node -e 'const k = ["NOTION_TOKEN", "BUTTONDOWN_API_KEY", "RESEND_API_KEY", "TURNSTILE_SECRET_KEY"]; process.stdout.write(JSON.stringify(Object.fromEntries(k.filter((n) => process.env[n]).map((n) => [n, process.env[n]]))))' | npx wrangler secret bulk
